server {
  listen 80;
  server_name mock.windgraham.art;

  location / {
    proxy_pass http://127.0.0.1:3101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket / LiveKit if used later
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Full-duplex voice agent WebSocket. Next.js route handlers cannot proxy raw
  # WS (no HTTP upgrade in App Router), so the browser connects to the agent
  # directly at ws(s)://<this-host>/ws/voice and nginx upgrades it here.
  location /ws/voice {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
